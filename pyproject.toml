[project]
name = "agentic-text2sql"
version = "0.1.0"
description = "Agentic Text2SQL — Schema Retrieval MVP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-ai-slim[anthropic,openai]>=0.2",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "openai>=2.30.0",
    "nltk>=3.9.4",
]

[project.optional-dependencies]
tracing = [
    "pydantic-ai-slim[openai]==2.65.0",
    "openinference-instrumentation-pydantic-ai==0.1.32",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
text2sql = "cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["text2sql_mvp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
dev-dependencies = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
