[project]
name = "agentic-text2sql"
version = "0.1.0"
description = "Agentic Text2SQL — Schema Retrieval MVP"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic-ai-slim[anthropic]>=0.2",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "openai>=2.30.0",
    "nltk>=3.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
text2sql = "cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["text2sql_mvp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
